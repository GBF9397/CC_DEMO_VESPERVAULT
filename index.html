<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vespervault - play</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0e1116; color: #e6edf3; font-family: Arial, sans-serif; text-align: center; }
  h1 { letter-spacing: 4px; margin: 0 0 6px; }
  p { color: #8b949e; margin: 6px 16px; }
  a { display: inline-block; margin: 10px; padding: 14px 26px; border: 2px solid #e3a33b; border-radius: 10px;
       color: #f2c14e; text-decoration: none; font-weight: bold; }
</style>
<script>
  // One link for everyone: phones and tablets get the touch version, computers the keyboard version.
  var ua = navigator.userAgent;
  var touchDevice = /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  location.replace(touchDevice ? "mobile/" : "pc/");
</script>
</head>
<body>
<div>
  <h1>VESPERVAULT</h1>
  <p>v0.07.4 - opening the game...</p>
  <a href="mobile/">Play on phone</a><a href="pc/">Play on PC</a>
  <p>Phone: turn it sideways (landscape).</p>
</div>
</body>
</html>
